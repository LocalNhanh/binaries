name: Update registry

# Scans all GitHub Releases and regenerates registry.json on main.
# Run after build/mirror workflows publish new assets.

on:
  workflow_dispatch:
  release:
    types: [published, edited, deleted]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Regenerate registry.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: node scripts/gen-registry.mjs > registry.json

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add registry.json
          # --cached detects both new (untracked) files and modifications,
          # unlike a plain `git diff` which ignores untracked files.
          if ! git diff --cached --quiet; then
            git commit -m "chore(registry): regenerate from releases"
            git push
          else
            echo "registry.json unchanged"
          fi
