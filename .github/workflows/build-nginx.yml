name: Build nginx

# Builds portable nginx from source (bundled pcre2 + zlib, ssl module) and
# publishes a GitHub Release asset per (version, platform).

on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'Space-separated nginx versions. Empty = manifest.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14,         platform: darwin-arm64 }
          - { runner: macos-13,         platform: darwin-x86_64 }
          - { runner: ubuntu-24.04,     platform: linux-x86_64 }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install openssl@3 || true

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Resolve versions
        id: vers
        run: |
          if [ -n "${{ github.event.inputs.versions }}" ]; then
            echo "list=${{ github.event.inputs.versions }}" >> "$GITHUB_OUTPUT"
          else
            list=$(node -e 'console.log(require("./manifests/versions.json").nginx.join(" "))')
            echo "list=$list" >> "$GITHUB_OUTPUT"
          fi

      - name: Build + publish each version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/*.sh
          for v in ${{ steps.vers.outputs.list }}; do
            echo "::group::nginx $v (${{ matrix.platform }})"
            ./scripts/build-nginx.sh "$v"
            ./scripts/publish.sh nginx "$v"
            echo "::endgroup::"
          done

      - name: Upload build artifacts (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nginx-${{ matrix.platform }}
          path: dist/out/*
          retention-days: 5
